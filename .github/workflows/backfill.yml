name: backfill

# The two-week sweep of the pypi-registry stream, which reads the page of every project that
# no run has read in full. A sweep reads as many pages as fit in 16,200 s (about 12,960,
# at one request every 1.25 s), so the roughly 930,000 pages take about 72 sweeps one after
# another. It runs when it is dispatched, and each sweep that leaves projects behind
# dispatches the next one. Start it once by hand.
#
# `sweep` exits with 3 when it read some projects and others are left, and with 0 when it
# is done, or when it read nothing, which is a page that stays unusable: the chain ends
# there and does not go round for ever. Any other code is a failure. The chain stops, and
# the failure issue opens. Dispatch the workflow again by hand once the cause is gone.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to backfill
        type: choice
        options:
          - sweep
        default: sweep

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The sweep stops starting projects after 270 minutes (16,200 s), and then compresses
    # the state and publishes it.
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    # The same group as the tick, so a sweep and a tick never publish at once.
    concurrency:
      group: stream-pypi-registry
      cancel-in-progress: false
    outputs:
      continue: ${{ steps.sweep.outputs.continue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --package pypi-registry
      - id: sweep
        name: Sweep
        # As in tick.yml: a hung sweep ends as a failed step, ten minutes before the job.
        timeout-minutes: 290
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          code=0
          uv run --package pypi-registry python -m pypi_registry sweep || code=$?
          if [ "$code" -eq 3 ]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh pypi-registry failure

  # The next sweep is dispatched from a job of its own, after the sweep job has left the
  # group above. A group holds one running job and one waiting job, and a job that queues
  # replaces the one that waits. Dispatched from inside the group, the next sweep would
  # queue while this one runs and replace the tick that waits behind it, and no tick would
  # run for as long as the sweeps go on. Dispatched from here, a tick that is waiting
  # starts first, and the next sweep waits behind it.
  redispatch:
    needs: sweep
    if: needs.sweep.outputs.continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run backfill.yml -f task=sweep
