name: tick

# The daily run of three streams, every six hours, each in a job of its own: pypi-registry,
# osv-pypi and pypi-downloads. The jobs do not wait for each other, and one that fails
# leaves the others alone. The catalog's job follows osv-pypi.
#
# pypi-registry reads what changed on PyPI since the last run and publishes it to the
# pypi-registry-current release. A normal run takes 30 to 40 minutes, and one that has
# much to read stops starting projects after 250 minutes (15,000 s, passed below). The
# step that runs it gives up after 327 minutes, which leaves 77 to finish the project in
# hand, compress the state and publish. The job's own limit is 330.
#
# osv-pypi reads OSV's index of changed advisories, fetches the records that moved since
# the last run and publishes the changes to the osv-pypi-current release. It stops
# fetching records after 20 minutes (1,200 s, passed below). The step that runs it gives
# up after 27 minutes, which leaves 7 to finish the record in hand, compress the state
# and publish. The job's own limit is 30.
#
# pypi-downloads counts each PyPI project's downloads for the days that are due, by
# starting a Cloud Run job that reads one day of PyPI's public BigQuery table, and
# publishes the counts to the pypi-downloads-current release. It starts no day after 50
# minutes (3,000 s, passed below), and starts none while the free tier or the budget says
# to wait. That only decides whether a day starts: a day started just before the deadline
# can wait the counter's task limit and a margin (1,800 + 300 = 2,100 s) and one 30 s
# poll, so the counting can last 3,000 + 2,100 + 30 s, about 86 minutes. Then the run
# brings the serving database up to date, or rebuilds it from the published counts when it
# cannot, compresses it at level 19 and publishes, and the deadline bounds none of that.
# The step that runs it gives up after 97 minutes, three before the job's limit of 100,
# which leaves about 11 minutes after the counting. Its job runs in the `gcp` environment,
# which only main may use, and has `id-token: write` for the sign-in to Google Cloud (no
# key): no other job of this workflow has either. The catalog does not wait for it.
#
# The catalog builds one serving database from what the three streams last published, and
# publishes it to the catalog-current release. It has no time budget of its own: its step
# gives up after 57 minutes, three before the job's limit of 60. Its job waits for
# osv-pypi, which takes half an hour at most, so that a build follows the fresh
# advisories, and runs whether or not osv-pypi succeeded, because a stream that failed is
# read from its last publish. It does not wait for the registry's job, which can queue for
# hours behind the sweep or the records pass, and so reads the registry's last publish.
# The step after the build keeps the scheduled runs enabled (scripts/keepalive.sh).
#
# Run a stream by hand with `bootstrap` to build its first state. The input names the one
# stream that it is for, and is accepted only for a stream that has never published.
# `override_reason` publishes although a publish gate failed, and the manifest logs the
# reason. It is for the one stream that `override_for` names, and a reason with no stream
# named overrides nothing. On a scheduled run every input is empty, so it never
# bootstraps or overrides any stream. The first run of the catalog is a dispatch with
# `bootstrap` set to catalog, once the three streams have published.
#
# The order of the first runs is in streams/pypi_registry/README.md,
# streams/osv_pypi/README.md and streams/pypi_downloads/README.md, under "On GitHub".

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Build this stream's first state (only if it has never published)
        type: choice
        options:
          - none
          - pypi-registry
          - osv-pypi
          - pypi-downloads
          - catalog
        default: none
      override_for:
        description: The stream that override_reason is for
        type: choice
        options:
          - none
          - pypi-registry
          - osv-pypi
          - pypi-downloads
          - catalog
        default: none
      override_reason:
        description: Publish although a gate failed, for this reason (the manifest logs it)
        type: string
        default: ""

permissions: {}

jobs:
  pypi-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      issues: write
    # The tick and the backfill (the sweep or the records pass) both publish
    # pypi-registry-current, so they run one at a time. A run that is waiting is never
    # started over one that is running.
    concurrency:
      group: stream-pypi-registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --package pypi-registry
      - name: Run the registry
        # A hung run should end as a failed step, which `failure()` below matches, and not
        # as a job that timed out, which GitHub may count as cancelled. The step gives up
        # three minutes before the job does, which is time enough to open the issue.
        #
        # The inputs name the stream that they are for, so this job takes `bootstrap`, and
        # the reason, only when they name pypi-registry. On a scheduled run every input is
        # an empty string, so it takes neither.
        timeout-minutes: 327
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          OVERRIDE_FOR: ${{ inputs.override_for }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "pypi-registry" ]; then
            args+=(--bootstrap)
          fi
          if [ -n "$OVERRIDE_REASON" ] && [ "$OVERRIDE_FOR" = "pypi-registry" ]; then
            args+=(--override-reason "$OVERRIDE_REASON")
          fi
          uv run --package pypi-registry python -m pypi_registry run \
            --max-seconds 15000 "${args[@]}"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh pypi-registry failure
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh pypi-registry success

  osv-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    # Only this job publishes osv-pypi-current, so its runs go one at a time. A run that
    # is waiting is never started over one that is running. The group is the stream's
    # own, so it never waits for a run of the registry, or for its backfill.
    concurrency:
      group: stream-osv-pypi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --package osv-pypi
      - name: Run osv-pypi
        # A hung run should end as a failed step, which `failure()` below matches, and not
        # as a job that timed out, which GitHub may count as cancelled. The step gives up
        # three minutes before the job does, which is time enough to open the issue.
        #
        # The run exits with 2 after it has published when some records did not parse.
        # That fails the step on purpose: the stream's issue opens, and the next run tries
        # those records again.
        #
        # The inputs name the stream that they are for, so this job takes `bootstrap`, and
        # the reason, only when they name osv-pypi. On a scheduled run every input is an
        # empty string, so it takes neither.
        timeout-minutes: 27
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          OVERRIDE_FOR: ${{ inputs.override_for }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "osv-pypi" ]; then
            args+=(--bootstrap)
          fi
          if [ -n "$OVERRIDE_REASON" ] && [ "$OVERRIDE_FOR" = "osv-pypi" ]; then
            args+=(--override-reason "$OVERRIDE_REASON")
          fi
          uv run --package osv-pypi python -m osv_pypi run --max-seconds 1200 "${args[@]}"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh osv-pypi failure
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh osv-pypi success

  pypi-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # Google Cloud admits the sign-in of this repository's main, in this environment, and
    # nothing else (see streams/pypi_downloads/README.md).
    environment: gcp
    permissions:
      contents: write
      issues: write
      id-token: write
    # Only this job publishes pypi-downloads-current, and a run may be waiting for the
    # counter's job, so its runs go one at a time. A run that is waiting is never started
    # over one that is running.
    concurrency:
      group: stream-pypi-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --package pypi-downloads
      - name: Run pypi-downloads
        # A hung run should end as a failed step, which `failure()` below matches, and not
        # as a job that timed out, which GitHub may count as cancelled. The step gives up
        # three minutes before the job does, which is time enough to open the issue.
        #
        # --max-seconds only decides whether a day starts. A day started just before it
        # waits for the counter's job (its task limit of 1,800 s, a margin of 300 s and
        # one 30 s poll), so the counting can last 3,000 + 2,100 + 30 s, about 86 minutes.
        # The update or rebuild of the serving database, its compression at level 19 and
        # the publish come after it, in the 11 or so minutes left of this step's 97.
        #
        # The run exits with 2 after it has published when a day failed, a partition
        # moved or could not be checked, or the guard held the run for spend, for the
        # 98% stop, or for want of any budget notification in 48 hours. That fails the
        # step on purpose: the stream's issue opens, and the first run that finds
        # nothing wrong closes it. A hold at the budget line is normal and exits 0.
        #
        # The inputs name the stream that they are for, so this job takes `bootstrap`, and
        # the reason, only when they name pypi-downloads. On a scheduled run every input is
        # an empty string, so it takes neither.
        timeout-minutes: 97
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          OVERRIDE_FOR: ${{ inputs.override_for }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "pypi-downloads" ]; then
            args+=(--bootstrap)
          fi
          if [ -n "$OVERRIDE_REASON" ] && [ "$OVERRIDE_FOR" = "pypi-downloads" ]; then
            args+=(--override-reason "$OVERRIDE_REASON")
          fi
          uv run --package pypi-downloads python -m pypi_downloads run \
            --max-seconds 3000 "${args[@]}"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh pypi-downloads failure
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh pypi-downloads success

  catalog:
    # It waits for osv-pypi, which is short, and not for the registry's job, which can
    # queue for hours behind the sweep or the records pass: it reads the registry's last
    # publish, and says in its manifest how old that is. `!cancelled()` runs it after an
    # osv-pypi that failed too, because that stream is then read from its last publish.
    needs: osv-pypi
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    # Only this job publishes catalog-current, so its runs go one at a time. A run that
    # is waiting is never started over one that is running.
    concurrency:
      group: catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --package catalog
      - name: Build the catalog
        # A hung run should end as a failed step, which `failure()` below matches, and not
        # as a job that timed out, which GitHub may count as cancelled. The step gives up
        # three minutes before the job does, which is time enough to open the issue.
        #
        # The run exits with 2 after it has published when a stream was carried from the
        # last build, or is stale, or could not be read, and a run that builds nothing
        # exits with 2 while the last build says so. That fails the step on purpose: the
        # catalog's issue opens, and the first run that finds every stream well closes it.
        #
        # The inputs name the stream that they are for, so this job takes `bootstrap`, and
        # the reason, only when they name catalog. On a scheduled run every input is an
        # empty string, so it takes neither.
        timeout-minutes: 57
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          OVERRIDE_FOR: ${{ inputs.override_for }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "catalog" ]; then
            args+=(--bootstrap)
          fi
          if [ -n "$OVERRIDE_REASON" ] && [ "$OVERRIDE_FOR" = "catalog" ]; then
            args+=(--override-reason "$OVERRIDE_REASON")
          fi
          uv run --package catalog python -m catalog run "${args[@]}"
      # Whatever happened to the build, so that a month of failed builds does not also let
      # GitHub disable the scheduled runs. It comes before the steps of the issue, so that
      # a keepalive that fails opens the issue as a failed build does.
      - if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/keepalive.sh
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh catalog failure
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rolling-issue.sh catalog success
