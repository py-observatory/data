[project]
name = "catalog"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["obskit", "packaging>=25", "pypi-registry", "osv-pypi"]

[tool.uv.sources]
obskit = { workspace = true }
pypi-registry = { workspace = true }
osv-pypi = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
