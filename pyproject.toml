[project]
name = "obskit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.workspace]
members = ["streams/pypi_registry", "streams/osv_pypi", "catalog"]

[tool.pytest.ini_options]
testpaths = ["tests", "streams", "catalog"]
addopts = "-q"
